<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=general-sans@400,500,600&display=swap');
  </style>
</head>
<body style="margin:0; padding:0; background:#F6F2EC;">
  <div style="font-family:'General Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:#F6F2EC; padding:24px;">
    <div style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:16px; overflow:hidden;">

      <div style="background:#E2674A; padding:26px 32px;">
        <div style="font-family:'Clash Display','Arial Black','Helvetica Neue',Arial,sans-serif; color:#ffffff; font-size:26px; font-weight:600; letter-spacing:0.5px;">NEXGIG<span style="color:#FFFFFF;">.</span></div>
        <div style="color:#FBE4DC; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; margin-top:4px;">Book. Play. Discover.</div>
      </div>

      <div style="padding:32px;">
        <h1 style="font-size:22px; font-weight:600; color:#1A1A1A; margin:0 0 16px;">Reset your password</h1>
        <p style="color:#57534E; font-size:15px; line-height:1.6; margin:0 0 20px;">
          Enter this code in the Nexgig app to reset your password:
        </p>

        <div style="background:#F6F2EC; border-radius:12px; padding:22px; text-align:center; margin:0 0 20px;">
          <div style="font-family:'Clash Display','Arial Black',Arial,sans-serif; font-size:34px; font-weight:600; letter-spacing:8px; color:#E2674A;">{{ .Token }}</div>
        </div>

        <p style="color:#57534E; font-size:15px; line-height:1.6; margin:0 0 14px;">
          This code expires shortly. If you didn't request a password reset, you can safely ignore this email — your password won't change.
        </p>
      </div>

      <div style="padding:16px 32px; border-top:1px solid #EDE7DE;">
        <div style="color:#8E8E93; font-size:12px;">Sent by Nexgig &middot; nexgigapp.com</div>
      </div>

    </div>
  </div>
</body>
</html>
